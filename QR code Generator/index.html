<title>QR Press</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root {
    --paper: #eef0ea;
    --card: #fbfaf5;
    --ink: #17181c;
    --ink-soft: #55584d;
    --rule: #cfd2c4;
    --accent: #a9711f;
    --accent-strong: #7f5416;
    --accent-tint: #a9711f1a;
    --focus: #a9711f;
    --radius: 6px;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #131419;
      --card: #1b1c22;
      --ink: #eae8df;
      --ink-soft: #a3a297;
      --rule: #35362f;
      --accent: #d9a44c;
      --accent-strong: #f0bd6a;
      --accent-tint: #d9a44c22;
      --focus: #d9a44c;
    }
  }

  :root[data-theme="dark"] {
    --paper: #131419;
    --card: #1b1c22;
    --ink: #eae8df;
    --ink-soft: #a3a297;
    --rule: #35362f;
    --accent: #d9a44c;
    --accent-strong: #f0bd6a;
    --accent-tint: #d9a44c22;
    --focus: #d9a44c;
  }

  * { box-sizing: border-box; }

  body {
    background: var(--paper);
    background-image:
      radial-gradient(var(--rule) 1px, transparent 1px);
    background-size: 22px 22px;
    color: var(--ink);
    font-family: 'IBM Plex Mono', 'SFMono-Regular', Menlo, Consolas, monospace;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
  }

  .card {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    padding: 34px 32px 30px;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 12px 32px -20px rgba(0, 0, 0, 0.35);
  }

  .eyebrow {
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
    margin: 0 0 6px;
  }

  h1 {
    font-family: 'Newsreader', Georgia, 'Times New Roman', serif;
    font-weight: 600;
    font-size: 30px;
    line-height: 1.1;
    letter-spacing: -0.01em;
    margin: 0 0 14px;
    text-wrap: balance;
  }

  .masthead-rule {
    height: 0;
    border-top: 2px solid var(--ink);
    border-bottom: 1px solid var(--rule);
    margin: 0 0 20px;
  }

  .lede {
    font-size: 12.5px;
    line-height: 1.55;
    color: var(--ink-soft);
    margin: 0 0 26px;
  }

  form { margin: 0; }

  label {
    display: block;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-soft);
    font-weight: 600;
    margin-bottom: 8px;
  }

  .field-row {
    display: flex;
    align-items: flex-end;
    gap: 12px;
    margin-bottom: 6px;
  }

  .field {
    flex: 1;
    min-width: 0;
  }

  input[type="text"] {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1.5px solid var(--rule);
    color: var(--ink);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    padding: 6px 2px 9px;
    outline: none;
    transition: border-color 0.15s ease;
  }

  input[type="text"]::placeholder { color: var(--ink-soft); opacity: 0.65; }

  input[type="text"]:focus {
    border-bottom: 1.5px solid var(--focus);
  }

  input[type="text"].invalid {
    border-bottom-color: #c0483f;
  }

  button {
    flex-shrink: 0;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    background: transparent;
    border: 1.5px solid var(--accent);
    border-radius: 3px;
    padding: 9px 16px;
    cursor: pointer;
    transition: background 0.12s ease, color 0.12s ease, transform 0.05s ease;
  }

  button:hover { background: var(--accent-tint); }

  button:active {
    background: var(--accent);
    color: var(--card);
    transform: translateY(1px);
  }

  button:focus-visible,
  input[type="text"]:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }

  .hint {
    font-size: 10.5px;
    color: var(--ink-soft);
    min-height: 14px;
    margin: 0 0 24px;
  }

  .plate {
    position: relative;
    margin-top: 4px;
    padding: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .corner {
    position: absolute;
    width: 16px;
    height: 16px;
    border-color: var(--accent);
    border-style: solid;
    border-width: 0;
    opacity: 0.85;
  }
  .corner.tl { top: 0; left: 0; border-top-width: 2px; border-left-width: 2px; }
  .corner.tr { top: 0; right: 0; border-top-width: 2px; border-right-width: 2px; }
  .corner.bl { bottom: 0; left: 0; border-bottom-width: 2px; border-left-width: 2px; }
  .corner.br { bottom: 0; right: 0; border-bottom-width: 2px; border-right-width: 2px; }

  .code-well {
    width: 216px;
    height: 216px;
    background: #ffffff;
    border: 1px solid var(--rule);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .code-well img,
  .code-well canvas {
    display: block;
  }

  .placeholder-text {
    font-size: 10.5px;
    color: #8a8d80;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    text-align: center;
    padding: 0 20px;
  }

  .plate.filled .code-well {
    animation: stamp 0.22s ease-out;
  }

  @media (prefers-reduced-motion: reduce) {
    .plate.filled .code-well { animation: none; }
    button:active { transform: none; }
  }

  @keyframes stamp {
    0% { opacity: 0; transform: scale(0.94); }
    100% { opacity: 1; transform: scale(1); }
  }

  .caption {
    margin-top: 16px;
    text-align: center;
  }

  .caption .url {
    font-size: 11.5px;
    color: var(--ink);
    word-break: break-all;
    line-height: 1.4;
  }

  .caption .note {
    margin-top: 6px;
    font-size: 10px;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
  }

  .caption[hidden] { display: none; }
</style>

<div class="card">
  <p class="eyebrow">Link &rarr; Code</p>
  <h1>QR Press</h1>
  <div class="masthead-rule"></div>

  <p class="lede">Turn a link into a scannable code. Each code is generated on this page from the exact text you enter, so the same link always presses the same pattern &mdash; nothing to expire or redirect.</p>

  <form id="qr-form" novalidate>
    <label for="link-input">Link</label>
    <div class="field-row">
      <div class="field">
        <input type="text" id="link-input" name="link" placeholder="example.com/your-page" autocomplete="off" spellcheck="false" />
      </div>
      <button type="submit">Generate</button>
    </div>
    <p class="hint" id="hint" aria-live="polite"></p>
  </form>

  <div class="plate" id="plate">
    <span class="corner tl"></span>
    <span class="corner tr"></span>
    <span class="corner bl"></span>
    <span class="corner br"></span>
    <div class="code-well" id="code-well">
      <span class="placeholder-text" id="placeholder">No code<br>generated yet</span>
    </div>
  </div>

  <div class="caption" id="caption" hidden>
    <div class="url" id="caption-url"></div>
    <div class="note">Regenerate any time by editing the link above.</div>
  </div>
</div>

<script>
  (function () {
    var form = document.getElementById('qr-form');
    var input = document.getElementById('link-input');
    var hint = document.getElementById('hint');
    var well = document.getElementById('code-well');
    var placeholder = document.getElementById('placeholder');
    var plate = document.getElementById('plate');
    var caption = document.getElementById('caption');
    var captionUrl = document.getElementById('caption-url');
    var qrInstance = null;

    function normalize(raw) {
      var trimmed = raw.trim();
      if (!trimmed) return '';
      if (/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(trimmed)) return trimmed;
      return 'https://' + trimmed;
    }

    function generate(e) {
      if (e) e.preventDefault();
      var raw = input.value;
      var url = normalize(raw);

      if (!url) {
        input.classList.add('invalid');
        hint.textContent = 'Enter a link first.';
        input.focus();
        return;
      }

      input.classList.remove('invalid');
      hint.textContent = '';

      if (placeholder) {
        placeholder.remove();
      }

      if (qrInstance && typeof qrInstance.clear === 'function') {
        qrInstance.clear();
        qrInstance.makeCode(url);
      } else if (typeof QRCode !== 'undefined') {
        well.innerHTML = '';
        qrInstance = new QRCode(well, {
          text: url,
          width: 192,
          height: 192,
          colorDark: '#17181c',
          colorLight: '#ffffff',
          correctLevel: QRCode.CorrectLevel.H
        });
      } else {
        hint.textContent = 'Could not load the QR engine. Try again in a moment.';
        return;
      }

      plate.classList.remove('filled');
      void plate.offsetWidth;
      plate.classList.add('filled');

      captionUrl.textContent = url;
      caption.hidden = false;
    }

    form.addEventListener('submit', generate);
    input.addEventListener('input', function () {
      if (input.classList.contains('invalid') && input.value.trim()) {
        input.classList.remove('invalid');
        hint.textContent = '';
      }
    });
  })();
</script>
